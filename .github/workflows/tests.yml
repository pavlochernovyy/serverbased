# Runs the jest suite (lib/ unit tests + every example/* app over HTTP) on every push to master,
# or on demand from the repository's Actions tab ("Run workflow").
# Lives in common-modules at app/exploring/packages/server-based/.github/, which becomes the repo
# root's .github/ once the package is split out to the serverbased repository.
name: tests

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/markdown-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # example/markdown-app keeps its own dependency (json2md) in its own package.json.
      - name: Install markdown-app dependencies
        run: npm ci --prefix example/markdown-app

      - name: Run tests
        run: npm test
